<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Low Poly City</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    model-viewer::part(progress-bar) {
      display: none;
    }
  </style>
</head>
<body>

<model-viewer
  id="viewer"
  src="./lowpoly.glb"

  camera-controls
  interaction-prompt="none"

  /* 🚀 BAŞLANGIÇ: ÇOK UZAK */
  camera-orbit="170deg 82deg 200m"
  camera-target="0m 0m 0m"

  min-camera-orbit="-180deg 20deg 20m"
  max-camera-orbit="180deg 85deg 260m"

  exposure="1"
  shadow-intensity="0.4"
  shadow-softness="0.7"
  tone-mapping="neutral"

  environment-image="https://modelviewer.dev/shared-assets/environments/neutral.hdr"
>
</model-viewer>

<script>
  const viewer = document.getElementById('viewer');

  viewer.addEventListener('load', () => {

    const startCam = {
      azimuth: 170,
      elevation: 82,
      distance: 200
    };

    const endCam = {
      azimuth: 45,
      elevation: 65,
      distance: 55
    };

    const duration = 3000;
    let startTime = null;

    function animate(time) {
      if (!startTime) startTime = time;
      const t = Math.min((time - startTime) / duration, 1);
      const ease = t * (2 - t); // easeOut

      const az =
        startCam.azimuth + (endCam.azimuth - startCam.azimuth) * ease;
      const el =
        startCam.elevation + (endCam.elevation - startCam.elevation) * ease;
      const dist =
        startCam.distance + (endCam.distance - startCam.distance) * ease;

      viewer.cameraOrbit = `${az}deg ${el}deg ${dist}m`;

      if (t < 1) requestAnimationFrame(animate);
    }

    /* 🧠 KRİTİK: ilk frame kaçmasın diye 2 frame bekle */
    requestAnimationFrame(() => {
      requestAnimationFrame(animate);
    });
  });
</script>

</body>
</html>
