<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Low Poly City</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    model-viewer::part(progress-bar) {
      display: none;
    }

    /* 📍 PIN */
    .hotspot {
      position: relative;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 0 6px rgba(255,255,255,0.15);
      user-select: none;
    }

    /* 🧾 PIN’E SABİT BİLGİ */
    .tooltip {
      position: absolute;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20,20,20,0.95);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      white-space: nowrap;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

<model-viewer
  id="viewer"
  src="./lowpoly.glb"

  camera-controls
  interaction-prompt="none"

  disable-pan="false"

  camera-orbit="170deg 82deg 200m"
  camera-target="0m 0m 0m"

  min-camera-orbit="-Infinity 15deg 20m"
  max-camera-orbit="Infinity 85deg 300m"

  exposure="1"
  shadow-intensity="0.4"
  shadow-softness="0.7"
  tone-mapping="neutral"

  environment-image="https://modelviewer.dev/shared-assets/environments/neutral.hdr"
>

  <!-- 📍 PIN 1 -->
  <div
    class="hotspot"
    slot="hotspot-1"
    data-position="10m 4m -6m"
    data-normal="0m 1m 0m">

    1
    <div class="tooltip">
      Cultural and social center “The Družba”
    </div>
  </div>

  <!-- 📍 PIN 2 -->
  <div
    class="hotspot"
    slot="hotspot-2"
    data-position="-8m 3m 12m"
    data-normal="0m 1m 0m">

    2
    <div class="tooltip">
      Public library and exhibition space
    </div>
  </div>

</model-viewer>

<script>
  document.querySelectorAll('.hotspot').forEach(pin => {
    const tooltip = pin.querySelector('.tooltip');
    let timer;

    pin.addEventListener('click', (e) => {
      e.stopPropagation();
      tooltip.style.display = 'block';

      clearTimeout(timer);
      timer = setTimeout(() => {
        tooltip.style.display = 'none';
      }, 5500);
    });
  });
</script>

</body>
</html>
