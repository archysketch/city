<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Low Poly City</title>

  <!-- model-viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2; /* Behance tarzı soft arka plan */
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
    }

    model-viewer::part(progress-bar) {
      display: none;
    }
  </style>
</head>
<body>

<model-viewer
  src="./lowpoly.glb"

  camera-controls
  disable-pan="false"

  /* Kamera */
  camera-orbit="45deg 65deg 35m"
  min-camera-orbit="-180deg 20deg 10m"
  max-camera-orbit="180deg 85deg 80m"
  camera-target="0m 0m 0m"

  /* Işık & render */
  exposure="1"
  shadow-intensity="0.4"
  shadow-softness="0.7"
  tone-mapping="neutral"

  environment-image="https://modelviewer.dev/shared-assets/environments/neutral.hdr"

  /* Performans */
  interaction-prompt="none"
>
</model-viewer>

</body>
</html>
