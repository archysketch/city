<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Low Poly City</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      touch-action: none; /* 🖱️ mouse kontrolünü netleştirir */
    }

    model-viewer::part(progress-bar) {
      display: none;
    }

    /* 📍 PIN */
    .hotspot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 0 6px rgba(255,255,255,0.15);
      user-select: none;
    }

    /* 🧾 SABİT BİLGİ KUTUSU */
    .info {
      position: absolute;
      display: none;
      background: rgba(20,20,20,0.9);
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      max-width: 220px;
      pointer-events: none;
    }
  </style>
</head>
<body>

<model-viewer
  id="viewer"
  src="./lowpoly.glb"

  camera-controls
  interaction-prompt="none"

  /* 🖱️ PAN AÇIK */
  disable-pan="false"

  /* 🔄 TAM SERBEST DÖNÜŞ */
  camera-orbit="170deg 82deg 200m"
  camera-target="0m 0m 0m"

  /* sadece zoom sınırı bırakıyoruz */
  min-camera-orbit="-Infinity 15deg 20m"
  max-camera-orbit="Infinity 85deg 300m"

  exposure="1"
  shadow-intensity="0.4"
  shadow-softness="0.7"
  tone-mapping="neutral"

  environment-image="https://modelviewer.dev/shared-assets/environments/neutral.hdr"
>

  <!-- 📍 PIN 1 -->
  <div
    class="hotspot"
    slot="hotspot-1"
    data-position="10m 4m -6m"
    data-normal="0m 1m 0m"
    data-info="Cultural and social center “The Družba”">
    1
  </div>

  <!-- 📍 PIN 2 -->
  <div
    class="hotspot"
    slot="hotspot-2"
    data-position="-8m 3m 12m"
    data-normal="0m 1m 0m"
    data-info="Public library and exhibition space">
    2
  </div>

</model-viewer>

<div id="infoBox" class="info"></div>

<script>
  const viewer = document.getElementById('viewer');
  const infoBox = document.getElementById('infoBox');
  let hideTimeout;

  /* 🎥 GİRİŞ ANİMASYONU */
  viewer.addEventListener('load', () => {
    const start = { az: 170, el: 82, d: 200 };
    const end   = { az: 45,  el: 65, d: 55 };
    const duration = 3000;
    let t0 = null;

    function animate(t) {
      if (!t0) t0 = t;
      const p = Math.min((t - t0) / duration, 1);
      const e = p * (2 - p);

      viewer.cameraOrbit = `
        ${start.az + (end.az - start.az) * e}deg
        ${start.el + (end.el - start.el) * e}deg
        ${start.d  + (end.d  - start.d ) * e}m
      `;

      if (p < 1) requestAnimationFrame(animate);
    }

    requestAnimationFrame(() => requestAnimationFrame(animate));
  });

  /* 📍 PIN TIKLAMA → SABİT BİLGİ */
  viewer.querySelectorAll('.hotspot').forEach(pin => {
    pin.addEventListener('click', (e) => {
      e.stopPropagation();
      clearTimeout(hideTimeout);

      infoBox.textContent = pin.dataset.info;
      infoBox.style.display = 'block';

      const rect = pin.getBoundingClientRect();
      infoBox.style.left = rect.right + 10 + 'px';
      infoBox.style.top  = rect.top - 6 + 'px';

      /* ⏱️ 5.5 sn sonra kutu kapanır */
      hideTimeout = setTimeout(() => {
        infoBox.style.display = 'none';
      }, 5500);
    });
  });
</script>

</body>
</html>
